---
name: Run tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-clj:
    strategy:
      matrix:
        # Supported Java versions: LTS releases and latest
        jdk: [17, 21, 25, 26]
        clojure: [11, 12, 13]

    name: Clojure ${{ matrix.clojure }} (Java ${{ matrix.jdk }})

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Java ${{ matrix.jdk }}
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.jdk }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-test-deps-${{ hashFiles('**/deps.edn') }}-${{ matrix.clojure }}-${{ matrix.jdk }}
          restore-keys: |
            ${{ runner.os }}-test-deps-${{ hashFiles('**/deps.edn') }}-${{ matrix.clojure }}-
            ${{ runner.os }}-test-deps-
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
      - name: Run tests
        run: CLOJURE_ALIAS=clojure-${{ matrix.clojure }} bin/kaocha

  build-cljs:
    name: ClojureScript
    strategy:
      matrix:
        mode: [none, advanced, cherry-none, cherry-advanced]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-test-deps-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-test-deps-
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests on ${{ matrix.mode }}
        run: bin/node ${{ matrix.mode }}

  build-bb:
    name: Babashka

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Java 11
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 11
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.deps.clj
            ~/.gitlibs
          key: ${{ runner.os }}-test-deps-${{ hashFiles('**/deps.edn') }}-${{ hashFiles('**/bb.edn') }}
          restore-keys: |
            ${{ runner.os }}-test-deps-${{ hashFiles('**/deps.edn') }}-
            ${{ runner.os }}-test-deps-
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
          bb: 1.13.230
      - name: Run tests
        run: bb test-bb

  doc-tests:
    # Builds tests from Documentation with test-doc-blocks and tests that
    # the examples are still valid.
    name: Doc Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.deps.clj
            ~/.gitlibs
          key: ${{ runner.os }}-test-deps-${{ hashFiles('**/deps.edn') }}-${{ hashFiles('**/bb.edn') }}
          restore-keys: |
            ${{ runner.os }}-test-deps-${{ hashFiles('**/deps.edn') }}-
            ${{ runner.os }}-test-deps-
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
          bb: 1.13.230
      - name: Run doc tests
        run: bb test-docs
